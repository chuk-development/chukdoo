name: chukdoo
description: "E2EE Todo app with natural language parsing"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.2

  # Navigation
  go_router: ^17.3.0

  # Backend
  supabase_flutter: ^2.15.0

  # Encryption
  cryptography: ^2.7.0
  flutter_secure_storage: ^10.3.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # File Operations
  file_picker: ^11.0.2
  share_plus: ^10.1.4

  # Notifications
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0

  # Background Tasks
  workmanager: ^0.9.0

  # UI
  cupertino_icons: ^1.0.8
  flutter_slidable: ^4.0.3
  google_fonts: ^8.1.0
  dynamic_color: ^1.7.0
  solar_icons: ^0.1.0
  material_design_icons_flutter: ^7.0.7296
  gpt_markdown: ^1.0.19

  # Date/Time & i18n
  intl: ^0.20.2

  # Networking (subscribed ICS calendar feeds)
  http: ^1.2.2

  # Utilities
  uuid: ^4.5.1
  connectivity_plus: ^7.1.1
  path: ^1.9.0

  # Desktop (System Tray & Window Management)
  tray_manager: ^0.5.3
  window_manager: ^0.5.1

  # Donations (RevenueCat)
  purchases_flutter: ^10.2.3

# Upstream material_design_icons_flutter does not build on Flutter 3.47
# (IconData is a final class now). See third_party/README.md.
dependency_overrides:
  material_design_icons_flutter:
    path: third_party/material_design_icons_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: false  # Using manual adaptive icons with Material You support
  ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#FEF7FF"
    theme_color: "#6750A4"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
